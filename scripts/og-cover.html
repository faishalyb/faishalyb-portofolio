<!doctype html>
<!--
  Source for public/og-cover.png (the 1200 x 630 social share image).
  Rebuild with: npm run og   (renders this page in headless Chrome)
  Colours (#336C01, #28A745) and type (Poppins) follow design-system/faishal-yusuf-baqir-portfolio/MASTER.md.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Share image</title>
    <style>
      @font-face {
        font-family: 'Poppins';
        src: url('../node_modules/@fontsource/poppins/files/poppins-latin-500-normal.woff2') format('woff2');
        font-weight: 500;
      }
      @font-face {
        font-family: 'Poppins';
        src: url('../node_modules/@fontsource/poppins/files/poppins-latin-700-normal.woff2') format('woff2');
        font-weight: 700;
      }
      * {
        margin: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        position: relative;
        display: grid;
        grid-template-rows: auto 1fr auto;
        padding: 64px 72px 56px;
        color: #1d2419;
        background: #f6faf3;
        font-family: 'Poppins', sans-serif;
      }
      body::before,
      body::after {
        content: '';
        position: absolute;
        border-radius: 50%;
      }
      body::before {
        top: -180px;
        right: -120px;
        width: 520px;
        height: 520px;
        background: rgba(40, 167, 69, 0.1);
      }
      body::after {
        bottom: -200px;
        left: 420px;
        width: 380px;
        height: 380px;
        background: rgba(51, 108, 1, 0.08);
      }
      body > * {
        position: relative;
        z-index: 1;
      }
      .name {
        display: flex;
        align-items: center;
        gap: 18px;
        font-family: 'Poppins', sans-serif;
        font-size: 32px;
        font-weight: 700;
      }
      h1 {
        align-self: center;
        max-width: 1000px;
        font-family: 'Poppins', sans-serif;
        font-size: 84px;
        font-weight: 700;
        letter-spacing: -0.035em;
        line-height: 1.02;
      }
      .mark {
        color: #336c01;
        background: linear-gradient(transparent 62%, rgba(40, 167, 69, 0.24) 62%);
      }
      .foot {
        display: flex;
        gap: 12px;
      }
      .chip {
        padding: 8px 20px;
        color: #336c01;
        background: #ffffff;
        border: 2px solid #d4e6cc;
        border-radius: 999px;
        font-size: 24px;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <p class="name">Faishal Yusuf Baqir</p>
    <h1>I build Flutter apps for places with <span class="mark">no signal.</span></h1>
    <p class="foot"><span class="chip">Flutter mobile developer</span><span class="chip">Offline-first field apps</span><span class="chip">Jakarta</span></p>
  </body>
</html>
